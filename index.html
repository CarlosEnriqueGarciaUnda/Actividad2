<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utileria JS</title>
    <link reel="Stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <h1>Fomulario de registro</h1>
        <p>Valida tus datos usando la <String>Libreria</String></p>
        <form id="registroForm">
            <div class="form-group">
                <label form="nombre">Nombre Completo: </label>
                <input type="text" id="nombre" placeholder="Ej. Juan" required>
                <span class="error.msg"></span>
            </div>

            <div class="form-group">
                <label for="telefono">Telefono (max. 10 digitos): </label>
                <input type= "number" id="telefono" placeholder="Ej.9518929016" required> 
                <span class="error-msg" id="errorTelefono"></span>
            </div>

            <div class="form-group">
                <label for="monto">Monto registro (pesos MXN): </label>
                <input type="numer" id="monto" placeholder="Ej.15000" required>
                <span class="error-msg" id="errorMonto"></span>
            </div>

            <button type="submit" class="btn">Validar y Procesar</button>
        </form>
        
        <br>
        <a href="login.html">Ir al login: </a>
    </div>

    <!--Ventana Modal-->
    <div id="modalEdad" class="modal">
        <div class="modal-content">
            <h2>Resultado de calculos: </h2>
            <p id="modalMensaje"></p>
            <p id="modalMontoFormateado"></p>
            <button id="cerrarModal" class="btn-secondaty">Cerrar</button>
        </div>
    </div>
    
    <!--Scrips-->
    <script src="js/utileria.js"></script>
    <script>
        const form=document.getElementById('registroForm');
        const modal = document.getElementById('modalEdad');
        const modalMensaje=document.getElementById('modalMensaje');
        const modalMontoFormateado= document.getElementById('modalMontoFormateado');
        const cerrarModalBtn= document.getElementById('cerrarModal');

        form.addEventListener('submit', function(e){
            e.preventDefault();

            document.querySelectorAll('.error-msg').forEach(el =>el.textContent='');
        });
    </script>
</body>
</html>
